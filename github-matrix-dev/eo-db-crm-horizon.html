<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amino Immigration — Case Management</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&family=Outfit:wght@200;300;400;500;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

:root {
  --bg: #faf9f7;
  --bg1: #ffffff;
  --bg2: #f4f3f0;
  --bg3: #eceae6;
  --bg4: #e2dfda;
  --border: #e5e2dd;
  --border2: #d4d0ca;
  --text: #2c2a26;
  --text-dim: #7a756d;
  --text-faint: #aba69e;
  --white: #1a1816;

  --figure: #1a6dd4;
  --figure-bg: #eef5fd;
  --figure-border: #c4ddf5;
  --ground: #7c5cbf;
  --ground-bg: #f3f0fa;
  --ground-border: #d9d0ee;
  --signal: #c2700a;
  --signal-bg: #fef6ed;
  --signal-border: #f0d9b8;
  --nearby: #0e8a6e;
  --nearby-bg: #eef8f5;
  --nearby-border: #bce5d9;
  --governance: #8b6834;
  --governance-bg: #faf5ed;
  --governance-border: #e5d5b8;
  --trajectory-line: #d4d0ca;

  --ins: #16a34a;
  --def: #1a6dd4;
  --con: #7c5cbf;
  --seg: #d9487a;
  --eva: #0e8a6e;
  --rec: #c2700a;
  --nul: #aba69e;
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Top Bar ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 52px;
  background: var(--bg1); border-bottom: 1px solid var(--border);
}
.topbar-brand {
  display: flex; align-items: center; gap: 12px;
}
.topbar-name {
  font-family: 'Source Serif 4', serif;
  font-size: 17px; font-weight: 600; color: var(--white);
}
.topbar-divider {
  width: 1px; height: 20px; background: var(--border2);
}
.topbar-section {
  font-size: 13px; color: var(--text-dim); font-weight: 400;
}
.topbar-right {
  display: flex; align-items: center; gap: 16px;
}
.topbar-search {
  padding: 6px 14px; width: 240px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 20px; font-size: 12px; color: var(--text);
  font-family: 'Outfit', sans-serif; outline: none;
}
.topbar-search::placeholder { color: var(--text-faint); }
.topbar-search:focus { border-color: var(--figure); background: var(--bg1); }
.topbar-user {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text-dim);
}
.user-circle {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--figure); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
}

/* ── Main Layout ── */
.main-layout { flex: 1; display: flex; overflow: hidden; }

/* ── Sidebar: Client List ── */
.sidebar {
  width: 280px; border-right: 1px solid var(--border);
  background: var(--bg1); display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 16px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-title {
  font-weight: 600; font-size: 13px; color: var(--white);
}
.sidebar-count {
  font-size: 11px; color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
}
.sidebar-scroll { flex: 1; overflow-y: auto; }

.client-item {
  padding: 14px 18px; cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.client-item:hover { background: var(--bg2); }
.client-item.active { background: var(--figure-bg); border-left: 3px solid var(--figure); }

.client-name { font-weight: 500; font-size: 14px; color: var(--white); margin-bottom: 2px; }
.client-case-type {
  font-size: 11px; color: var(--text-dim);
  display: flex; align-items: center; gap: 6px;
}
.case-badge {
  padding: 1px 6px; border-radius: 3px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 600;
  background: var(--figure-bg); color: var(--figure);
  border: 1px solid var(--figure-border);
}
.status-dot-active { color: var(--ins); }
.status-dot-archived { color: var(--text-faint); }
.client-filed {
  font-size: 10px; color: var(--text-faint); margin-top: 4px;
}

/* ── Center: Record View ── */
.record-view {
  flex: 1; overflow-y: auto; background: var(--bg);
}

.record-empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 8px; height: 100%;
}
.record-empty-text { font-size: 14px; color: var(--text-dim); font-weight: 300; }
.record-empty-sub { font-size: 12px; color: var(--text-faint); }

/* ── Record Header ── */
.record-header {
  padding: 28px 36px 24px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
}
.record-header-top {
  display: flex; align-items: flex-start; justify-content: space-between;
}
.record-client-name {
  font-family: 'Source Serif 4', serif;
  font-size: 28px; font-weight: 600; color: var(--white);
}
.record-status-badge {
  padding: 4px 12px; border-radius: 20px;
  font-size: 11px; font-weight: 500;
}
.status-active { background: #e8f7ee; color: #16643a; border: 1px solid #b8e4ca; }
.status-archived { background: var(--bg3); color: var(--text-faint); border: 1px solid var(--border2); text-decoration: line-through; }
.status-pending { background: #fef6e8; color: #8a6d20; border: 1px solid #eedcaa; }

.record-meta {
  display: flex; align-items: center; gap: 20px;
  margin-top: 8px; font-size: 12px; color: var(--text-dim);
}
.record-meta-item {
  display: flex; align-items: center; gap: 4px;
}
.record-meta-label { color: var(--text-faint); }

/* ── Section styling ── */
.section {
  margin: 0; padding: 24px 36px;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.section-edge {
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
}

.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.section-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px;
  display: flex; align-items: center; gap: 8px;
}
.section-subtitle {
  font-size: 10px; font-weight: 300; color: var(--text-faint);
  text-transform: none; letter-spacing: 0;
}
.section-toggle {
  font-size: 10px; color: var(--text-faint); cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  padding: 3px 8px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--bg1);
  transition: all .15s;
}
.section-toggle:hover { background: var(--bg2); color: var(--text-dim); }

/* ── Figure fields ── */
.figure-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 0;
}
.figure-cell {
  padding: 14px 16px;
  border: 1px solid var(--border);
  margin: -1px 0 0 -1px;
  background: var(--bg1);
  transition: background .1s;
}
.figure-cell:hover { background: var(--figure-bg); }
.figure-cell-label {
  font-size: 10px; font-weight: 500; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: .3px;
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 4px;
}
.figure-cell-value {
  font-size: 14px; color: var(--white); font-weight: 400;
}
.figure-cell-formula {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--eva); font-weight: 400;
}
.figure-cell-computed {
  font-size: 20px; color: var(--white); font-weight: 500;
}
.figure-cell-computed-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--eva); margin-top: 2px;
}
.figure-cell-link {
  color: var(--con); cursor: pointer;
  font-size: 13px;
}
.figure-cell-link:hover { text-decoration: underline; }
.figure-cell-conflict {
  display: flex; flex-direction: column; gap: 2px;
}
.conflict-value {
  font-size: 12px; display: flex; align-items: center; gap: 6px;
}
.conflict-source {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--text-faint);
}
.conflict-winner {
  padding: 1px 4px; border-radius: 2px;
  background: var(--figure-bg); color: var(--figure);
  font-family: 'JetBrains Mono', monospace; font-size: 8px;
}
.field-history-dot {
  width: 5px; height: 5px; border-radius: 50%;
  display: inline-block;
}

/* ── Ground cards ── */
.ground-row {
  display: flex; flex-wrap: wrap; gap: 10px;
}
.ground-chip {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--bg1);
  border: 1px solid var(--ground-border);
  border-radius: 8px;
  min-width: 160px;
  transition: all .15s;
}
.ground-chip:hover { background: var(--ground-bg); }
.ground-chip-icon {
  width: 32px; height: 32px; border-radius: 6px;
  background: var(--ground-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.ground-chip-text { flex: 1; }
.ground-chip-key {
  font-size: 10px; color: var(--text-dim); font-weight: 500;
}
.ground-chip-val {
  font-size: 13px; color: var(--white); font-weight: 400;
}
.ground-chip-from {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; color: var(--text-faint);
}

/* ── Nearby ── */
.nearby-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.nearby-card {
  padding: 14px 16px;
  background: var(--bg1);
  border: 1px solid var(--nearby-border);
  border-radius: 8px;
  cursor: pointer;
  transition: all .15s;
}
.nearby-card:hover { background: var(--nearby-bg); border-color: var(--nearby); }
.nearby-card-name {
  font-weight: 500; font-size: 13px; color: var(--white);
  margin-bottom: 4px;
}
.nearby-card-reason {
  font-size: 10px; color: var(--text-dim);
  margin-bottom: 6px;
}
.shared-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.shared-tag {
  padding: 1px 6px; border-radius: 3px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  background: var(--nearby-bg); color: var(--nearby);
  border: 1px solid var(--nearby-border);
}

/* ── Governance ── */
.governance-list { display: flex; flex-direction: column; gap: 8px; }
.governance-rule {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 14px;
  background: var(--bg1);
  border: 1px solid var(--governance-border);
  border-radius: 8px;
}
.governance-icon {
  width: 28px; height: 28px; border-radius: 6px;
  background: var(--governance-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0; margin-top: 2px;
}
.governance-text { flex: 1; }
.governance-desc {
  font-size: 12px; color: var(--text); font-weight: 400;
}
.governance-scope {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--text-faint); margin-top: 2px;
}

/* ── Trajectory ── */
.trajectory-row {
  display: flex; align-items: center; gap: 0;
  padding: 4px 0;
}
.traj-node {
  display: flex; flex-direction: column; align-items: center;
  position: relative;
}
.traj-dot {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 7px; font-weight: 600;
  border: 2px solid;
  position: relative;
  z-index: 1;
}
.traj-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; color: var(--text-faint);
  margin-top: 4px; white-space: nowrap;
}
.traj-connector {
  width: 24px; height: 2px;
  background: var(--trajectory-line);
  flex-shrink: 0;
}

.traj-INS .traj-dot { background: #e8f7ee; color: var(--ins); border-color: var(--ins); }
.traj-DEF .traj-dot { background: var(--figure-bg); color: var(--def); border-color: var(--def); }
.traj-CON .traj-dot { background: #f3f0fa; color: var(--con); border-color: var(--con); }
.traj-SEG .traj-dot { background: #fce8f0; color: var(--seg); border-color: var(--seg); }
.traj-EVA .traj-dot { background: var(--nearby-bg); color: var(--eva); border-color: var(--eva); }
.traj-REC .traj-dot { background: var(--signal-bg); color: var(--rec); border-color: var(--rec); }

/* ── Signal cards ── */
.signal-row { display: flex; flex-direction: column; gap: 10px; }
.signal-card {
  padding: 14px 16px;
  background: var(--bg1);
  border: 1px solid var(--signal-border);
  border-radius: 8px;
  position: relative;
}
.signal-ephemeral {
  position: absolute; top: 10px; right: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; color: var(--signal); opacity: .5;
  text-transform: uppercase; letter-spacing: .5px;
}
.signal-desc {
  font-size: 13px; color: var(--text); font-weight: 400;
  margin-bottom: 8px; max-width: 80%;
}
.signal-viz {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 6px;
}
.signal-bar-container {
  flex: 1; height: 6px; background: var(--bg3);
  border-radius: 3px; position: relative; overflow: visible;
}
.signal-bar-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--bg3), var(--signal));
}
.signal-bar-mean {
  position: absolute; top: -4px; width: 2px; height: 14px;
  background: var(--text-faint); border-radius: 1px;
}
.signal-bar-you {
  position: absolute; top: -6px; width: 10px; height: 18px;
  border-radius: 3px; border: 2px solid var(--signal);
  background: var(--signal-bg);
}
.signal-stats {
  display: flex; gap: 16px;
  font-size: 11px;
}
.signal-stat { color: var(--text-dim); }
.signal-stat b { color: var(--text); font-weight: 500; }
.signal-track {
  margin-top: 8px; padding: 4px 10px;
  font-size: 10px; font-weight: 500;
  background: transparent; border: 1px solid var(--signal-border);
  color: var(--signal); border-radius: 4px;
  cursor: pointer; transition: all .15s;
}
.signal-track:hover { background: var(--signal-bg); }

.signal-none {
  font-size: 12px; color: var(--text-faint); font-style: italic;
  padding: 8px 0;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border2); }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-name">Amino Immigration</div>
    <div class="topbar-divider"></div>
    <div class="topbar-section">Case Management</div>
  </div>
  <div class="topbar-right">
    <input class="topbar-search" placeholder="Search clients, cases, documents...">
    <div class="topbar-user">
      <div class="user-circle">SL</div>
      Sara Lopez
    </div>
  </div>
</div>

<div class="main-layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Clients</span>
      <span class="sidebar-count">4 active</span>
    </div>
    <div class="sidebar-scroll" id="clientList"></div>
  </div>

  <!-- Record View -->
  <div class="record-view" id="recordView">
    <div class="record-empty" id="emptyState">
      <div class="record-empty-text">Select a client to view their record</div>
      <div class="record-empty-sub">You'll see their case details, the context around them, and patterns across similar cases</div>
    </div>
    <div id="recordContent" style="display:none;"></div>
  </div>

</div>

<script>
// ── Data ──
const CLIENTS = {
  'rec001': {
    name: 'Maria Garcia', status: 'archived',
    fields: {
      email: { value: 'maria@new.com', history: [
        { value: 'maria@old.com', agent: '@intake', ts: '09:15', op: 'DEF' },
        { value: 'maria@new.com', agent: '@caseworker', ts: '10:30', op: 'DEF' }
      ], eva: { strategy: 'latest' } },
      phone: { value: '615-555-0198' },
      region: { value: 'Nashville' },
      intakeDate: { value: '2025-03-27' },

    },
    cases: ['rec101'],
    trajectory: [

      { op: 'EVA', label: 'Conflict resolved', ts: '2:01p' },
      { op: 'SEG', label: 'Archived', ts: '4:00p' }
    ]
  },
  'rec002': {
    name: 'Carlos Mendez', status: 'active',
    fields: {
      email: { value: 'carlos.mendez@gmail.com' },
      phone: { value: '615-555-0142' },
      region: { value: 'Nashville' },
      intakeDate: { value: '2025-03-27' },
      preferredLanguage: { value: 'Spanish' },
    },
    cases: ['rec102'],
    trajectory: [
      { op: 'INS', label: 'Created', ts: 'Mar 27 3:00p' },
      { op: 'CON', label: 'Case linked', ts: '3:00p' },
      { op: 'DEF', label: 'Phone added', ts: '3:01p' }
    ]
  },
  'rec003': {
    name: 'Aisha Patel', status: 'active',
    fields: {

      region: { value: 'Memphis' },

      preferredLanguage: { value: 'English' },
    },
    cases: ['rec103'],
    trajectory: [
      { op: 'INS', label: 'Created', ts: 'Feb 14' },
      { op: 'CON', label: 'Case linked', ts: 'Feb 14' },
      { op: 'DEF', label: 'Region set', ts: 'Feb 15' },

    ]
  },
  'rec004': {

    },

      { op: 'DEF', label: 'Status update', ts: 'Feb 8' },
      { op: 'DEF', label: 'RFE response', ts: 'Mar 15' }
    ]
  }
};

const CASES = {
  'rec101': { type: 'H1B', status: 'approved', filed: '2025-06-01', daysOpen: 45, resolutionDays: 38, caseworker: '@sara' },
  'rec102': { type: 'L1A', status: 'pending', filed: '2025-07-15', daysOpen: 12, resolutionDays: null, caseworker: '@sara' },
  'rec103': { type: 'H1B', status: 'under review', filed: '2025-04-20', daysOpen: 67, resolutionDays: null, caseworker: '@maria_l' },
  'rec104': { type: 'EB2-NIW', status: 'RFE received', filed: '2025-02-01', daysOpen: 112, resolutionDays: null, caseworker: '@sara' }
};

const GROUNDS = [
  { key: 'Regulatory Hold', value: 'Active', icon: '⚠', source: 'Clients collection', from: 'app.tblClients' },
  { key: 'Default Region', value: 'Nashville', icon: '◉', source: 'Clients collection', from: 'app.tblClients' },
  { key: 'Intake Policy', value: 'Standard', icon: '◎', source: 'Clients collection', from: 'app.tblClients' },
  { key: 'Timezone', value: 'America/Chicago', icon: '◷', source: 'Application', from: 'app' },
  { key: 'Firm', value: 'Amino Immigration', icon: '⬡', source: 'Application', from: 'app' },
  { key: 'Review Cycle', value: 'Biweekly', icon: '↻', source: 'Cases collection', from: 'app.tblCases' },
];

const GOVERNANCE_RULES = [
  { desc: 'Email conflicts resolve by latest timestamp', scope: 'All client email fields', icon: '⊨', target: '*.fldEmail' },
  { desc: 'Case deadline computed as filing date + 180 calendar days', scope: 'All case deadline fields', icon: 'ƒ', target: '*.fldDeadline' },
  { desc: 'Archived records excluded from active views', scope: 'All collections', icon: '|', target: '*.status' },
  { desc: 'Review cycle requires biweekly status update', scope: 'Cases collection', icon: '↻', target: 'app.tblCases.*' },
];

// ── Rendering ──
let selectedClient = null;

function renderClients() {
  const list = document.getElementById('clientList');
  list.innerHTML = Object.entries(CLIENTS).map(([id, c]) => {
    const caseInfo = c.cases.map(cid => CASES[cid]).filter(Boolean);
    const caseType = caseInfo[0]?.type || '—';
    const active = selectedClient === id ? 'active' : '';
    const statusIcon = c.status === 'active' ? '●' : '○';
    const statusClass = c.status === 'active' ? 'status-dot-active' : 'status-dot-archived';
    return `<div class="client-item ${active}" onclick="selectClient('${id}')">
      <div class="client-name">${c.name}</div>
      <div class="client-case-type">
        <span class="${statusClass}">${statusIcon}</span>
        <span class="case-badge">${caseType}</span>
        <span>${CASES[c.cases[0]]?.status || ''}</span>
      </div>
      <div class="client-filed">Filed ${CASES[c.cases[0]]?.filed || '—'}</div>
    </div>`;
  }).join('');
}

function selectClient(id) {
  selectedClient = id;
  renderClients();
  renderRecord();
}

function renderRecord() {
  const empty = document.getElementById('emptyState');
  const content = document.getElementById('recordContent');

  if (!selectedClient) {
    empty.style.display = 'flex';
    content.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  content.style.display = 'block';

  const c = CLIENTS[selectedClient];
  const caseData = c.cases.map(cid => ({ id: cid, ...CASES[cid] }));
  const primaryCase = caseData[0];

  const statusClass = c.status === 'active' ? 'status-active' : 'status-archived';

  // Find nearby clients
  const nearby = Object.entries(CLIENTS)
    .filter(([id]) => id !== selectedClient)
    .map(([id, nc]) => {
      const shared = [];
      const ncCase = CASES[nc.cases[0]];
      if (ncCase?.type === primaryCase?.type) shared.push(ncCase.type);
      if (nc.fields.region?.value === c.fields.region?.value) shared.push(nc.fields.region.value);
      if (ncCase?.caseworker === primaryCase?.caseworker) shared.push(ncCase.caseworker);
      if (nc.fields.preferredLanguage?.value === c.fields.preferredLanguage?.value) shared.push(nc.fields.preferredLanguage.value);
      return { id, name: nc.name, shared, caseType: ncCase?.type, status: ncCase?.status };
    })
    .filter(n => n.shared.length > 0)
    .sort((a, b) => b.shared.length - a.shared.length);

  // Detect signals
  const allDaysOpen = Object.values(CASES).map(c => c.daysOpen).filter(d => d != null);
  const meanDays = allDaysOpen.reduce((a,b)=>a+b,0) / allDaysOpen.length;
  const stdDays = Math.sqrt(allDaysOpen.reduce((a,b) => a+(b-meanDays)**2, 0) / allDaysOpen.length);

  const signals = [];
  if (primaryCase?.daysOpen != null && stdDays > 0) {
    const z = (primaryCase.daysOpen - meanDays) / stdDays;
    if (Math.abs(z) > 0.3) {
      signals.push({
        desc: `This case has been open ${primaryCase.daysOpen} days — ${z > 0 ? 'longer' : 'shorter'} than average`,
        myVal: primaryCase.daysOpen, mean: meanDays, z, n: allDaysOpen.length, field: 'Days open'
      });
    }
  }
  if (primaryCase?.resolutionDays != null) {
    const allRes = Object.values(CASES).map(c => c.resolutionDays).filter(d => d != null);
    if (allRes.length > 1) {
      const meanRes = allRes.reduce((a,b)=>a+b,0) / allRes.length;
      signals.push({
        desc: `Resolved in ${primaryCase.resolutionDays} days (population average: ${meanRes.toFixed(0)})`,
        myVal: primaryCase.resolutionDays, mean: meanRes, z: 0, n: allRes.length, field: 'Resolution time'
      });
    }
  }

  // Filter grounds relevant to this client
  const clientGrounds = GROUNDS.filter(g => {
    if (g.from === 'app' || g.from === 'app.tblClients') return true;
    if (g.from === 'app.tblCases' && caseData.length > 0) return true;
    return false;
  });

  let html = '';

  // ═══ Record Header ═══
  html += `<div class="record-header">
    <div class="record-header-top">
      <div class="record-client-name">${c.name}</div>
      <div class="record-status-badge ${statusClass}">${c.status}</div>
    </div>
    <div class="record-meta">
      <div class="record-meta-item"><span class="record-meta-label">Case:</span> ${primaryCase?.type || '—'} · ${primaryCase?.status || '—'}</div>
      <div class="record-meta-item"><span class="record-meta-label">Filed:</span> ${primaryCase?.filed || '—'}</div>
      <div class="record-meta-item"><span class="record-meta-label">Caseworker:</span> ${primaryCase?.caseworker || '—'}</div>
      <div class="record-meta-item"><span class="record-meta-label">Days open:</span> ${primaryCase?.daysOpen ?? '—'}</div>
    </div>
  </div>`;

  // ═══ Figure: Client Details ═══
  html += `<div class="section" style="background:var(--bg1);">
    <div class="section-edge" style="background:var(--figure);"></div>
    <div class="section-header">
      <div class="section-title" style="color:var(--figure);">Client Record <span class="section-subtitle">— what this client is</span></div>
    </div>
    <div class="figure-grid">`;

  // Email with conflict history
  const emailField = c.fields.email;
  if (emailField?.history) {
    html += `<div class="figure-cell">
      <div class="figure-cell-label">Email <div class="field-history-dot" style="background:var(--figure);margin-left:4px;" title="Has history"></div></div>
      <div class="figure-cell-value">${emailField.value}</div>
      <div style="margin-top:6px;font-size:10px;color:var(--text-faint);">
        ${emailField.history.map(h => `<div style="margin-top:2px;"><span style="color:var(--text-dim);">${h.value}</span> <span style="font-family:'JetBrains Mono',monospace;font-size:8px;">${h.agent} ${h.ts}</span></div>`).join('')}
      </div>
      ${emailField.eva ? `<div style="margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--eva);">⊨ resolved: ${emailField.eva.strategy}</div>` : ''}
    </div>`;
  } else {
    html += `<div class="figure-cell"><div class="figure-cell-label">Email</div><div class="figure-cell-value">${emailField?.value || '—'}</div></div>`;
  }

  html += `<div class="figure-cell"><div class="figure-cell-label">Phone</div><div class="figure-cell-value">${c.fields.phone?.value || '—'}</div></div>`;
  html += `<div class="figure-cell"><div class="figure-cell-label">Region</div><div class="figure-cell-value">${c.fields.region?.value || '—'}</div></div>`;
  html += `<div class="figure-cell"><div class="figure-cell-label">Intake Date</div><div class="figure-cell-value">${c.fields.intakeDate?.value || '—'}</div></div>`;
  html += `<div class="figure-cell"><div class="figure-cell-label">Language</div><div class="figure-cell-value">${c.fields.preferredLanguage?.value || '—'}</div></div>`;

  // Linked cases
  html += `<div class="figure-cell">
    <div class="figure-cell-label">Linked Cases</div>
    ${caseData.map(cs => `<div class="figure-cell-link" onclick="alert('Navigate to case ${cs.id}')">${cs.type} — ${cs.status}</div>`).join('')}
  </div>`;

  html += `</div></div>`;

  // ═══ Trajectory ═══
  html += `<div class="section">
    <div class="section-header">
      <div class="section-title" style="color:var(--text-dim);">Trajectory <span class="section-subtitle">— where this record has been</span></div>
    </div>
    <div class="trajectory-row">`;
  c.trajectory.forEach((t, i) => {
    if (i > 0) html += `<div class="traj-connector"></div>`;
    html += `<div class="traj-node traj-${t.op}">
      <div class="traj-dot">${t.op}</div>
      <div class="traj-label">${t.label}</div>
    </div>`;
  });
  html += `</div></div>`;

  // ═══ Ground ═══
  html += `<div class="section">
    <div class="section-edge" style="background:var(--ground);opacity:.5;"></div>
    <div class="section-header">
      <div class="section-title" style="color:var(--ground);">Context <span class="section-subtitle">— conditions that apply here</span></div>
    </div>
    <div class="ground-row">`;
  for (const g of clientGrounds) {
    const isWarning = g.key === 'Regulatory Hold' && g.value === 'Active';
    html += `<div class="ground-chip" ${isWarning ? 'style="border-color:#d9487a;background:#fdf2f5;"' : ''}>
      <div class="ground-chip-icon" ${isWarning ? 'style="background:#fdf2f5;color:#d9487a;"' : ''}>${g.icon}</div>
      <div class="ground-chip-text">
        <div class="ground-chip-key">${g.key}</div>
        <div class="ground-chip-val" ${isWarning ? 'style="color:#d9487a;font-weight:500;"' : ''}>${g.value}</div>
        <div class="ground-chip-from">${g.source}</div>
      </div>
    </div>`;
  }
  html += `</div></div>`;

  // ═══ Nearby ═══
  html += `<div class="section">
    <div class="section-edge" style="background:var(--nearby);opacity:.4;"></div>
    <div class="section-header">
      <div class="section-title" style="color:var(--nearby);">Similar Clients <span class="section-subtitle">— nearby in the key-space</span></div>
    </div>`;
  if (nearby.length > 0) {
    html += `<div class="nearby-grid">`;
    for (const n of nearby) {
      html += `<div class="nearby-card" onclick="selectClient('${n.id}')">
        <div class="nearby-card-name">${n.name}</div>
        <div class="nearby-card-reason">${n.caseType} · ${n.status}</div>
        <div class="shared-tags">
          ${n.shared.map(s => `<span class="shared-tag">${s}</span>`).join('')}
        </div>
      </div>`;
    }
    html += `</div>`;
  } else {
    html += `<div style="font-size:12px;color:var(--text-faint);font-style:italic;">No similar clients found</div>`;
  }
  html += `</div>`;

  // ═══ Governance ═══
  html += `<div class="section">
    <div class="section-edge" style="background:var(--governance);opacity:.35;"></div>
    <div class="section-header">
      <div class="section-title" style="color:var(--governance);">Governance <span class="section-subtitle">— rules that apply to this record</span></div>
      <button class="section-toggle">4 rules</button>
    </div>
    <div class="governance-list">`;
  for (const r of GOVERNANCE_RULES) {
    html += `<div class="governance-rule">
      <div class="governance-icon">${r.icon}</div>
      <div class="governance-text">
        <div class="governance-desc">${r.desc}</div>
        <div class="governance-scope">${r.scope} · ${r.target}</div>
      </div>
    </div>`;
  }
  html += `</div></div>`;

  // ═══ Signals ═══
  html += `<div class="section" style="border-bottom:none;">
    <div class="section-edge" style="background:var(--signal);opacity:.3;"></div>
    <div class="section-header">
      <div class="section-title" style="color:var(--signal);">Patterns <span class="section-subtitle">— what the database sees across similar records</span></div>
      <span style="font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--signal);opacity:.5;letter-spacing:.5px;">EPHEMERAL · COMPUTED ON OBSERVATION</span>
    </div>`;
  if (signals.length > 0) {
    html += `<div class="signal-row">`;
    for (const sig of signals) {
      const max = sig.mean * 2.5;
      const meanPct = (sig.mean / max) * 100;
      const myPct = Math.min(95, (sig.myVal / max) * 100);
      html += `<div class="signal-card">
        <div class="signal-ephemeral">SIG</div>
        <div class="signal-desc">${sig.desc}</div>
        <div class="signal-viz">
          <div class="signal-bar-container">
            <div class="signal-bar-fill" style="width:${myPct}%"></div>
            <div class="signal-bar-mean" style="left:${meanPct}%" title="Population mean"></div>
            <div class="signal-bar-you" style="left:calc(${myPct}% - 5px)" title="This record"></div>
          </div>
        </div>
        <div class="signal-stats">
          <div class="signal-stat"><b>${sig.myVal}</b> this case</div>
          <div class="signal-stat"><b>${sig.mean.toFixed(0)}</b> avg</div>
          <div class="signal-stat"><b>${sig.n}</b> cases</div>
        </div>
        <button class="signal-track">INS → Track this pattern permanently</button>
      </div>`;
    }
    html += `</div>`;
  } else {
    html += `<div class="signal-none">No notable patterns detected across this population</div>`;
  }
  html += `</div>`;

  content.innerHTML = html;
  document.getElementById('recordView').scrollTop = 0;
}

// Init
renderClients();
</script>
</body>
</html>
