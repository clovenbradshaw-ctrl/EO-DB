<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EO///DB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #0a0b0e;
  --bg1: #10121a;
  --bg2: #161926;
  --bg3: #1e2235;
  --bg4: #262b42;
  --border: #2a2f48;
  --border2: #363d5c;
  --text: #c8cde0;
  --text-dim: #6e7494;
  --text-faint: #464d6e;
  --white: #e8ecf8;

  /* Operator colors */
  --nul: #5c5f7a;
  --sig: #7eb8da;
  --ins: #4ade80;
  --seg: #f472b6;
  --con: #a78bfa;
  --syn: #fbbf24;
  --def: #38bdf8;
  --eva: #34d399;
  --rec: #fb923c;

  --accent: #38bdf8;
  --danger: #ef4444;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Top Bar ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 48px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.topbar-logo {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 15px;
  color: var(--white);
  letter-spacing: 2px;
}

.topbar-logo span { color: var(--accent); }

.topbar-status {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
}

.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--ins);
  box-shadow: 0 0 6px var(--ins);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.status-item { color: var(--text-dim); }
.status-item b { color: var(--text); font-weight: 500; }

.topbar-user {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
}

.user-avatar {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--bg4);
  border: 1px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--accent);
  font-weight: 600;
}

/* ── Nav Tabs ── */
.nav-tabs {
  display: flex;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  gap: 0;
  flex-shrink: 0;
}

.nav-tab {
  padding: 10px 18px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  font-family: 'JetBrains Mono', monospace;
}

.nav-tab:hover { color: var(--text); background: var(--bg2); }
.nav-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ── Main Layout ── */
.main { flex: 1; display: flex; overflow: hidden; }

.panel {
  display: none;
  flex: 1;
  overflow: hidden;
}
.panel.active { display: flex; }

/* ── Horizon Panel ── */
.horizon-panel {
  flex-direction: column;
}

.horizon-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
}

.horizon-search {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s;
}

.horizon-search:focus { border-color: var(--accent); }
.horizon-search::placeholder { color: var(--text-faint); }

.filter-btn {
  padding: 7px 14px;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}

.filter-btn:hover { background: var(--bg3); color: var(--text); }
.filter-btn.active { background: var(--bg3); color: var(--accent); border-color: var(--accent); }

.horizon-body {
  flex: 1;
  overflow: auto;
  padding: 16px;
}

.state-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.state-table th {
  text-align: left;
  padding: 8px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-faint);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 1;
}

.state-table td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  vertical-align: top;
}

.state-table tr:hover td { background: var(--bg2); }

.target-path {
  color: var(--text);
  cursor: pointer;
}
.target-path:hover { color: var(--accent); text-decoration: underline; }

.target-seg { color: var(--text-faint); }
.target-leaf { color: var(--white); font-weight: 500; }

.val-str { color: var(--def); }
.val-obj { color: var(--text-dim); font-size: 10px; }
.val-formula { color: var(--eva); font-style: italic; }
.val-null { color: var(--text-faint); }

.op-badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.5px;
  font-family: 'JetBrains Mono', monospace;
}

.op-INS { background: rgba(74,222,128,0.12); color: var(--ins); border: 1px solid rgba(74,222,128,0.25); }
.op-DEF { background: rgba(56,189,248,0.12); color: var(--def); border: 1px solid rgba(56,189,248,0.25); }
.op-CON { background: rgba(167,139,250,0.12); color: var(--con); border: 1px solid rgba(167,139,250,0.25); }
.op-SEG { background: rgba(244,114,182,0.12); color: var(--seg); border: 1px solid rgba(244,114,182,0.25); }
.op-SYN { background: rgba(251,191,36,0.12); color: var(--syn); border: 1px solid rgba(251,191,36,0.25); }
.op-EVA { background: rgba(52,211,153,0.12); color: var(--eva); border: 1px solid rgba(52,211,153,0.25); }
.op-REC { background: rgba(251,146,60,0.12); color: var(--rec); border: 1px solid rgba(251,146,60,0.25); }
.op-NUL { background: rgba(92,95,122,0.12); color: var(--nul); border: 1px solid rgba(92,95,122,0.25); }

.agent-tag {
  color: var(--text-dim);
  font-size: 10px;
}

.ts-tag {
  color: var(--text-faint);
  font-size: 10px;
  white-space: nowrap;
}

/* ── Log Panel ── */
.log-panel {
  flex-direction: column;
}

.log-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
}

.op-filter-group {
  display: flex;
  gap: 4px;
}

.op-filter {
  padding: 4px 8px;
  font-size: 9px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
  background: var(--bg);
}

.op-filter:hover { opacity: 0.8; }
.op-filter.active { opacity: 1; }
.op-filter.inactive { opacity: 0.3; }

.log-body {
  flex: 1;
  overflow: auto;
  padding: 0;
}

.log-entry {
  display: grid;
  grid-template-columns: 60px 48px 1fr auto auto;
  gap: 12px;
  align-items: center;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  transition: background 0.1s;
  cursor: pointer;
}

.log-entry:hover { background: var(--bg2); }

.log-seq {
  color: var(--text-faint);
  font-size: 10px;
  text-align: right;
}

.log-target { color: var(--text); }
.log-operand {
  color: var(--text-dim);
  font-size: 10px;
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── Graph Panel ── */
.graph-panel {
  flex-direction: row;
}

.graph-sidebar {
  width: 280px;
  border-right: 1px solid var(--border);
  background: var(--bg1);
  overflow: auto;
  flex-shrink: 0;
}

.graph-sidebar-header {
  padding: 12px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-faint);
  border-bottom: 1px solid var(--border);
}

.graph-node-item {
  padding: 8px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.1s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.graph-node-item:hover { background: var(--bg2); color: var(--text); }
.graph-node-item.active { background: var(--bg2); color: var(--accent); }

.node-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.graph-canvas {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.graph-svg {
  width: 100%;
  height: 100%;
}

/* ── Detail Drawer ── */
.detail-drawer {
  width: 380px;
  background: var(--bg1);
  border-left: 1px solid var(--border);
  overflow: auto;
  flex-shrink: 0;
  display: none;
}

.detail-drawer.open { display: block; }

.drawer-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

.drawer-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--white);
  word-break: break-all;
}

.drawer-subtitle {
  font-size: 10px;
  color: var(--text-faint);
  margin-top: 4px;
  font-family: 'JetBrains Mono', monospace;
}

.drawer-section {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.drawer-section-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-faint);
  margin-bottom: 8px;
}

.drawer-field {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 4px 0;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
}

.drawer-field-key { color: var(--text-dim); }
.drawer-field-val { color: var(--text); text-align: right; max-width: 60%; word-break: break-all; }

.drawer-log-entry {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
}

.drawer-log-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}

.drawer-log-operand {
  color: var(--text-dim);
  font-size: 10px;
  padding-left: 8px;
  border-left: 2px solid var(--border);
  margin-top: 4px;
}

/* ── Replay Bar ── */
.replay-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: var(--bg1);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.replay-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-faint);
  white-space: nowrap;
}

.replay-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  outline: none;
}

.replay-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid var(--bg);
  box-shadow: 0 0 6px rgba(56,189,248,0.4);
}

.replay-seq {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  min-width: 70px;
  text-align: right;
}

.replay-ts {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  min-width: 140px;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border2); }

/* ── Responsive ── */
@media (max-width: 900px) {
  .detail-drawer { width: 300px; }
  .graph-sidebar { width: 200px; }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-logo">EO<span>///</span>DB</div>
  <div class="topbar-status">
    <div class="status-dot"></div>
    <span class="status-item">seq <b id="currentSeq">4215</b></span>
    <span class="status-item">events <b>15</b></span>
    <span class="status-item">targets <b>12</b></span>
    <span class="status-item">edges <b>2</b></span>
  </div>
  <div class="topbar-user">
    <div class="user-avatar">ML</div>
    @admin:amino
  </div>
</div>

<!-- Nav Tabs -->
<div class="nav-tabs">
  <div class="nav-tab active" onclick="switchTab('horizon')">Horizon</div>
  <div class="nav-tab" onclick="switchTab('log')">Log</div>
  <div class="nav-tab" onclick="switchTab('graph')">Graph</div>
</div>

<!-- Main Content -->
<div class="main">

  <!-- ═══ Horizon Panel ═══ -->
  <div id="panel-horizon" class="panel horizon-panel active">
    <div class="horizon-toolbar">
      <input class="horizon-search" placeholder="SEG — filter targets by value, path, or operator..." id="horizonSearch" oninput="filterHorizon()">
      <button class="filter-btn active" onclick="toggleRef(this,'all')">ALL</button>
      <button class="filter-btn" onclick="toggleRef(this,'con')">CON</button>
      <button class="filter-btn" onclick="toggleRef(this,'seg')">SEG</button>
      <button class="filter-btn" onclick="toggleRef(this,'eva')">EVA</button>
    </div>
    <div style="display:flex;flex:1;overflow:hidden;">
      <div class="horizon-body" style="flex:1;">
        <table class="state-table">
          <thead>
            <tr>
              <th>Target</th>
              <th>Value</th>
              <th>Last Op</th>
              <th>Agent</th>
              <th>Updated</th>
            </tr>
          </thead>
          <tbody id="horizonBody"></tbody>
        </table>
      </div>
      <div class="detail-drawer" id="horizonDrawer">
        <div class="drawer-header">
          <div class="drawer-title" id="drawerTarget">—</div>
          <div class="drawer-subtitle" id="drawerSubtitle">—</div>
        </div>
        <div class="drawer-section">
          <div class="drawer-section-title">Current State</div>
          <div id="drawerState"></div>
        </div>
        <div class="drawer-section">
          <div class="drawer-section-title">Event History</div>
          <div id="drawerHistory"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Log Panel ═══ -->
  <div id="panel-log" class="panel log-panel">
    <div class="log-toolbar">
      <div class="op-filter-group">
        <div class="op-filter op-INS active" style="background:rgba(74,222,128,0.12);color:var(--ins);" onclick="toggleOpFilter(this,'INS')">INS</div>
        <div class="op-filter op-DEF active" style="background:rgba(56,189,248,0.12);color:var(--def);" onclick="toggleOpFilter(this,'DEF')">DEF</div>
        <div class="op-filter op-CON active" style="background:rgba(167,139,250,0.12);color:var(--con);" onclick="toggleOpFilter(this,'CON')">CON</div>
        <div class="op-filter op-SEG active" style="background:rgba(244,114,182,0.12);color:var(--seg);" onclick="toggleOpFilter(this,'SEG')">SEG</div>
        <div class="op-filter op-SYN active" style="background:rgba(251,191,36,0.12);color:var(--syn);" onclick="toggleOpFilter(this,'SYN')">SYN</div>
        <div class="op-filter op-EVA active" style="background:rgba(52,211,153,0.12);color:var(--eva);" onclick="toggleOpFilter(this,'EVA')">EVA</div>
        <div class="op-filter op-REC active" style="background:rgba(251,146,60,0.12);color:var(--rec);" onclick="toggleOpFilter(this,'REC')">REC</div>
      </div>
      <input class="horizon-search" style="max-width:300px;" placeholder="Filter by target..." id="logFilter" oninput="renderLog()">
    </div>
    <div class="log-body" id="logBody"></div>
  </div>

  <!-- ═══ Graph Panel ═══ -->
  <div id="panel-graph" class="panel graph-panel">
    <div class="graph-sidebar">
      <div class="graph-sidebar-header">CON Edges — Targets</div>
      <div id="graphNodes"></div>
    </div>
    <div class="graph-canvas">
      <svg class="graph-svg" id="graphSvg" viewBox="0 0 800 500"></svg>
    </div>
  </div>

</div>

<!-- Replay Bar -->
<div class="replay-bar">
  <span class="replay-label">Replay</span>
  <input type="range" class="replay-slider" id="replaySlider" min="0" max="14" value="14" oninput="updateReplay()">
  <span class="replay-seq" id="replaySeq">seq 4215</span>
  <span class="replay-ts" id="replayTs">2025-03-27 16:30:00</span>
</div>

<script>
// ── Mock Data ──
const LOG = [
  { seq:4201, op:"INS", target:"app.tblClients.rec001", operand:{name:"Maria Garcia",status:"active"}, agent:"@intake:amino", ts:"2025-03-27T09:12:00Z" },
  { seq:4202, op:"INS", target:"app.tblCases.rec101", operand:{type:"H1B",filed:"2025-06-01"}, agent:"@intake:amino", ts:"2025-03-27T09:12:01Z" },
  { seq:4203, op:"CON", target:"app.tblClients.rec001.fldCases", operand:{added:["app.tblCases.rec101"]}, agent:"@intake:amino", ts:"2025-03-27T09:12:02Z" },
  { seq:4204, op:"DEF", target:"app.tblCases.rec101.fldStatus", operand:"pending", agent:"@caseworker:amino", ts:"2025-03-27T09:15:00Z" },
  { seq:4205, op:"DEF", target:"app.tblClients.rec001.fldEmail", operand:"maria@old.com", agent:"@intake:amino", ts:"2025-03-27T09:15:30Z" },
  { seq:4206, op:"DEF", target:"app.tblClients.rec001.fldEmail", operand:"maria@new.com", agent:"@caseworker:amino", ts:"2025-03-27T10:30:00Z" },
  { seq:4207, op:"DEF", target:"app.tblCases.rec101.fldStatus", operand:"approved", agent:"@caseworker:amino", ts:"2025-03-27T14:00:00Z" },
  { seq:4208, op:"EVA", target:"app.tblClients.rec001.fldEmail", operand:{strategy:"latest"}, agent:"@admin:amino", ts:"2025-03-27T14:01:00Z" },
  { seq:4209, op:"DEF", target:"app.tblCases.rec101.fldDeadline", operand:{formula:"DAYS_UNTIL(filed + 180)"}, agent:"@admin:amino", ts:"2025-03-27T14:05:00Z" },
  { seq:4210, op:"INS", target:"app.tblClients.rec002", operand:{name:"Carlos Mendez",status:"active"}, agent:"@intake:amino", ts:"2025-03-27T15:00:00Z" },
  { seq:4211, op:"INS", target:"app.tblCases.rec102", operand:{type:"L1A",filed:"2025-07-15"}, agent:"@intake:amino", ts:"2025-03-27T15:00:01Z" },
  { seq:4212, op:"CON", target:"app.tblClients.rec002.fldCases", operand:{added:["app.tblCases.rec102"]}, agent:"@intake:amino", ts:"2025-03-27T15:00:02Z" },
  { seq:4213, op:"SEG", target:"app.tblClients.rec001", operand:{boundary:"exclude",reason:"archived"}, agent:"@admin:amino", ts:"2025-03-27T16:00:00Z" },
  { seq:4214, op:"DEF", target:"app.tblCases.rec102.fldNotes", operand:"Initial consultation complete", agent:"@caseworker:amino", ts:"2025-03-27T16:30:00Z" },
  { seq:4215, op:"REC", target:"schema.tblCases", operand:{contains:[{op:"DEF",target:"schema.tblCases.fldUrgency",operand:{type:"select"}}],reason:"Added urgency field"}, agent:"@admin:amino", ts:"2025-03-27T17:00:00Z" }
];

// Derive projected state by folding
function foldState(upToIndex) {
  const state = {};
  for (let i = 0; i <= upToIndex && i < LOG.length; i++) {
    const e = LOG[i];
    if (e.op === 'INS' || e.op === 'DEF' || e.op === 'EVA' || e.op === 'SEG' || e.op === 'REC') {
      if (!state[e.target]) state[e.target] = { target: e.target, value: null, last_seq: 0, last_op: '', last_agent: '', last_ts: '' };
      if (e.op === 'INS') {
        state[e.target].value = e.operand;
      } else if (e.op === 'DEF') {
        if (typeof state[e.target].value === 'object' && state[e.target].value !== null && typeof e.operand === 'object' && e.operand !== null && !e.operand.formula) {
          state[e.target].value = { ...state[e.target].value, ...e.operand };
        } else {
          state[e.target].value = e.operand;
        }
      } else {
        state[e.target].value = e.operand;
      }
      state[e.target].last_seq = e.seq;
      state[e.target].last_op = e.op;
      state[e.target].last_agent = e.agent;
      state[e.target].last_ts = e.ts;
    } else if (e.op === 'CON') {
      if (!state[e.target]) state[e.target] = { target: e.target, value: null, last_seq: 0, last_op: '', last_agent: '', last_ts: '' };
      state[e.target].value = e.operand;
      state[e.target].last_seq = e.seq;
      state[e.target].last_op = e.op;
      state[e.target].last_agent = e.agent;
      state[e.target].last_ts = e.ts;
    }
  }
  return state;
}

// ── Rendering ──
let currentTab = 'horizon';
let activeOps = new Set(['INS','DEF','CON','SEG','SYN','EVA','REC']);
let replayIndex = LOG.length - 1;
let selectedTarget = null;

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.nav-tab[onclick*="${tab}"]`).classList.add('active');
  document.getElementById(`panel-${tab}`).classList.add('active');
  if (tab === 'graph') renderGraph();
}

function formatTarget(target) {
  const parts = target.split('.');
  const segs = parts.slice(0, -1).map(p => `<span class="target-seg">${p}.</span>`).join('');
  return segs + `<span class="target-leaf">${parts[parts.length-1]}</span>`;
}

function formatValue(val) {
  if (val === null || val === undefined) return '<span class="val-null">∅</span>';
  if (typeof val === 'object' && val.formula) return `<span class="val-formula">ƒ ${val.formula}</span>`;
  if (typeof val === 'object' && val.strategy) return `<span class="val-formula">⊨ ${val.strategy}</span>`;
  if (typeof val === 'object' && val.boundary) return `<span class="val-formula">| ${val.boundary}${val.reason ? ' — '+val.reason : ''}</span>`;
  if (typeof val === 'object' && val.added) return `<span class="val-obj">→ ${val.added.join(', ')}</span>`;
  if (typeof val === 'object' && val.contains) return `<span class="val-obj">{${val.contains.length} sub-ops} ${val.reason||''}</span>`;
  if (typeof val === 'string') return `<span class="val-str">${val}</span>`;
  if (typeof val === 'object') {
    const entries = Object.entries(val).map(([k,v]) => `${k}: ${typeof v === 'string' ? v : JSON.stringify(v)}`).join(', ');
    return `<span class="val-obj">{${entries}}</span>`;
  }
  return `<span class="val-str">${val}</span>`;
}

function formatTs(ts) {
  return ts.replace('T', ' ').replace('Z', '').slice(0, 19);
}

function renderHorizon() {
  const state = foldState(replayIndex);
  const search = document.getElementById('horizonSearch').value.toLowerCase();
  const tbody = document.getElementById('horizonBody');

  const entries = Object.values(state)
    .filter(s => !search || s.target.toLowerCase().includes(search) || JSON.stringify(s.value).toLowerCase().includes(search))
    .sort((a, b) => a.target.localeCompare(b.target));

  tbody.innerHTML = entries.map(s => `
    <tr onclick="selectTarget('${s.target}')">
      <td><span class="target-path">${formatTarget(s.target)}</span></td>
      <td>${formatValue(s.value)}</td>
      <td><span class="op-badge op-${s.last_op}">${s.last_op}</span></td>
      <td><span class="agent-tag">${s.last_agent.replace(':amino','')}</span></td>
      <td><span class="ts-tag">${formatTs(s.last_ts)}</span></td>
    </tr>
  `).join('');
}

function filterHorizon() { renderHorizon(); }

function selectTarget(target) {
  selectedTarget = target;
  const drawer = document.getElementById('horizonDrawer');
  drawer.classList.add('open');

  const state = foldState(replayIndex);
  const s = state[target];

  document.getElementById('drawerTarget').textContent = target;
  document.getElementById('drawerSubtitle').textContent = `Last modified seq ${s?.last_seq || '—'}`;

  // Current state
  const stateDiv = document.getElementById('drawerState');
  if (s && typeof s.value === 'object' && s.value !== null) {
    stateDiv.innerHTML = Object.entries(s.value).map(([k,v]) =>
      `<div class="drawer-field"><span class="drawer-field-key">${k}</span><span class="drawer-field-val">${typeof v === 'string' ? v : JSON.stringify(v)}</span></div>`
    ).join('');
  } else {
    stateDiv.innerHTML = `<div class="drawer-field"><span class="drawer-field-key">value</span><span class="drawer-field-val">${s?.value ?? '∅'}</span></div>`;
  }

  // Event history for this target
  const histDiv = document.getElementById('drawerHistory');
  const events = LOG.filter((e, i) => i <= replayIndex && (e.target === target || e.target.startsWith(target + '.')));
  histDiv.innerHTML = events.map(e => `
    <div class="drawer-log-entry">
      <div class="drawer-log-meta">
        <span class="op-badge op-${e.op}">${e.op}</span>
        <span class="ts-tag">${formatTs(e.ts)}</span>
        <span class="agent-tag">${e.agent.replace(':amino','')}</span>
      </div>
      <div class="drawer-log-operand">${typeof e.operand === 'string' ? e.operand : JSON.stringify(e.operand)}</div>
    </div>
  `).join('') || '<div style="color:var(--text-faint);font-size:10px;">No events</div>';
}

function renderLog() {
  const filter = document.getElementById('logFilter').value.toLowerCase();
  const body = document.getElementById('logBody');

  const events = LOG.filter((e, i) => i <= replayIndex)
    .filter(e => activeOps.has(e.op))
    .filter(e => !filter || e.target.toLowerCase().includes(filter))
    .reverse();

  body.innerHTML = events.map(e => `
    <div class="log-entry" onclick="switchTab('horizon');selectTarget('${e.target}')">
      <span class="log-seq">${e.seq}</span>
      <span class="op-badge op-${e.op}">${e.op}</span>
      <span class="log-target">${formatTarget(e.target)}</span>
      <span class="log-operand">${typeof e.operand === 'string' ? e.operand : JSON.stringify(e.operand)}</span>
      <span class="ts-tag">${formatTs(e.ts)}</span>
    </div>
  `).join('');
}

function toggleOpFilter(el, op) {
  if (activeOps.has(op)) {
    activeOps.delete(op);
    el.classList.remove('active');
    el.classList.add('inactive');
  } else {
    activeOps.add(op);
    el.classList.add('active');
    el.classList.remove('inactive');
  }
  renderLog();
}

function toggleRef(el, type) {
  document.querySelectorAll('.horizon-toolbar .filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderHorizon();
}

// ── Graph ──
function renderGraph() {
  const conEvents = LOG.filter((e, i) => i <= replayIndex && e.op === 'CON');
  const nodesSet = new Set();
  const edges = [];

  conEvents.forEach(e => {
    const source = e.target.split('.').slice(0, 3).join('.');
    if (e.operand.added) {
      e.operand.added.forEach(dest => {
        nodesSet.add(source);
        nodesSet.add(dest);
        edges.push({ source, dest });
      });
    }
  });

  const nodes = Array.from(nodesSet);
  const sidebar = document.getElementById('graphNodes');
  sidebar.innerHTML = nodes.map((n, i) => {
    const colors = ['var(--ins)', 'var(--def)', 'var(--con)', 'var(--eva)', 'var(--rec)', 'var(--seg)'];
    return `<div class="graph-node-item" onclick="highlightNode('${n}')">
      <div class="node-dot" style="background:${colors[i % colors.length]}"></div>
      ${n.split('.').pop()}
    </div>`;
  }).join('');

  // SVG graph
  const svg = document.getElementById('graphSvg');
  const cx = 400, cy = 250;
  const radius = 160;
  const nodePositions = {};

  nodes.forEach((n, i) => {
    const angle = (i / nodes.length) * Math.PI * 2 - Math.PI / 2;
    nodePositions[n] = {
      x: cx + Math.cos(angle) * radius,
      y: cy + Math.sin(angle) * radius
    };
  });

  let svgContent = '';

  // Draw edges
  edges.forEach(e => {
    const s = nodePositions[e.source];
    const d = nodePositions[e.dest];
    if (s && d) {
      const midX = (s.x + d.x) / 2;
      const midY = (s.y + d.y) / 2 - 20;
      svgContent += `<path d="M${s.x},${s.y} Q${midX},${midY} ${d.x},${d.y}" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrow)"/>`;
    }
  });

  // Draw nodes
  nodes.forEach((n, i) => {
    const p = nodePositions[n];
    const colors = ['#4ade80', '#38bdf8', '#a78bfa', '#34d399', '#fb923c', '#f472b6'];
    const c = colors[i % colors.length];
    const label = n.split('.').pop();
    svgContent += `
      <circle cx="${p.x}" cy="${p.y}" r="28" fill="${c}15" stroke="${c}" stroke-width="1.5"/>
      <text x="${p.x}" y="${p.y + 1}" text-anchor="middle" dominant-baseline="middle" fill="${c}" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600">${label}</text>
    `;
  });

  svg.innerHTML = `
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="35" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa" fill-opacity="0.6"/>
      </marker>
    </defs>
    ${svgContent}
  `;
}

// ── Replay ──
function updateReplay() {
  const slider = document.getElementById('replaySlider');
  replayIndex = parseInt(slider.value);
  const e = LOG[replayIndex];
  document.getElementById('replaySeq').textContent = `seq ${e.seq}`;
  document.getElementById('replayTs').textContent = formatTs(e.ts);
  document.getElementById('currentSeq').textContent = e.seq;
  renderHorizon();
  renderLog();
  if (currentTab === 'graph') renderGraph();
}

// ── Init ──
renderHorizon();
renderLog();
</script>
</body>
</html>
