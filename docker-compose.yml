# Local n8n instance for the Filen credential webhook.
# Run: docker compose up -d
# Then import n8n-filen-webhook.json into n8n at http://localhost:5678

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
