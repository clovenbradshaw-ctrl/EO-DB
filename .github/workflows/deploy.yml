name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'github-matrix-dev/app/**'
      - 'nl/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: github-matrix-dev/app/package-lock.json

      - name: Install dependencies
        working-directory: github-matrix-dev/app
        run: npm ci

      - name: Build
        working-directory: github-matrix-dev/app
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Pre-fills the homeserver input so the firm's deploy keeps its
          # existing UX. Source no longer hardcodes a firm-specific value.
          VITE_DEFAULT_HOMESERVER: app.aminoimmigration.com

      - name: Copy standalone /nl/ assets into build output
        # Ships the self-contained HTML plus any baked centroids/alignment
        # JSON committed at nl/ (skips .py / .md which are build-time only).
        run: |
          mkdir -p docs/nl
          cp nl/*.html docs/nl/ 2>/dev/null || true
          cp nl/*.json docs/nl/ 2>/dev/null || true

      - name: Add .nojekyll
        run: touch docs/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
